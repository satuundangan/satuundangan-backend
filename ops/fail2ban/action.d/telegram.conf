# Fail2Ban Action Configuration for Telegram Alert
# Sends instant HTML alerts to Telegram chat/group on IP ban and unban.

[Definition]

# Option:  actionstart
# Notes.:  Command executed once at the start of Fail2Ban.
actionstart = curl -s -X POST "https://api.telegram.org/bot<telegram_token>/sendMessage" \
    -d chat_id="<telegram_chat_id>" \
    -d parse_mode="HTML" \
    -d text="🛡️ <b>[Fail2ban] Layanan Proteksi Server Aktif</b>%0AJail: <code><name></code> siap memantau serangan pada server."

# Option:  actionstop
# Notes.:  Command executed once at the stop of Fail2Ban.
actionstop = curl -s -X POST "https://api.telegram.org/bot<telegram_token>/sendMessage" \
    -d chat_id="<telegram_chat_id>" \
    -d parse_mode="HTML" \
    -d text="⚠️ <b>[Fail2ban] Layanan Proteksi Dihentikan</b>%0AJail: <code><name></code> berhenti memantau."

# Option:  actioncheck
# Notes.:  Command executed before each actionban/actionunban.
actioncheck =

# Option:  actionban
# Notes.:  Command executed when an IP is banned.
actionban = curl -s -X POST "https://api.telegram.org/bot<telegram_token>/sendMessage" \
    -d chat_id="<telegram_chat_id>" \
    -d parse_mode="HTML" \
    -d text="🚨 <b>[SECURITY ALERT] IP Diblokir!</b>%0A%0A🎯 <b>Jail:</b> <code><name></code>%0A🛑 <b>IP Penyerang:</b> <code><ip></code>%0A🔢 <b>Percobaan Gagal:</b> <failures> kali%0A⏱️ <b>Durasi Blokir:</b> <bantime> detik (24 jam)%0A🕒 <b>Waktu:</b> $(date '+%%d %%b %%Y %%H:%%M:%%S WIB')%0A%0A<i>IP telah diblokir di iptables server Biznet secara otomatis.</i>"

# Option:  actionunban
# Notes.:  Command executed when an IP is unbanned.
actionunban = curl -s -X POST "https://api.telegram.org/bot<telegram_token>/sendMessage" \
    -d chat_id="<telegram_chat_id>" \
    -d parse_mode="HTML" \
    -d text="ℹ️ <b>[Fail2ban] Blokir IP Dicabut</b>%0A%0A🎯 <b>Jail:</b> <code><name></code>%0A🔓 <b>IP:</b> <code><ip></code>%0AMasa blokir telah selesai dan akses dinormalkan kembali."

[Init]
# Default parameters (overridden in jail.local / jail.conf)
telegram_token =
telegram_chat_id =
