name: Deploy to Biznet

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/apps/satu-undangan
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            grep -qxF "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKrkXebsxqjarH0PShwvG4dFL5IoeaXVuqp45vGIaU+f fauzan@satuundangan" ~/.ssh/authorized_keys 2>/dev/null || echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKrkXebsxqjarH0PShwvG4dFL5IoeaXVuqp45vGIaU+f fauzan@satuundangan" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            if [ -f .env ]; then
              if grep -q "^GEMINI_API_KEY=" .env; then
                sed -i 's|^GEMINI_API_KEY=.*|GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}|' .env
              else
                echo -e "\nGEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
              fi
              if grep -q "^RESEND_API_KEY=" .env; then
                sed -i 's|^RESEND_API_KEY=.*|RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}|' .env
              else
                echo -e "\nRESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
              fi
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f || true
