# Fail2Ban Jail Configuration for SatuUndangan Production Server (Biznet)
# Location on server: /etc/fail2ban/jail.d/satuundangan.conf

[DEFAULT]
# Ignore loopback and internal Docker bridge subnets
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12 10.0.0.0/8

# Ban duration: 24 hours (86400 seconds)
bantime  = 86400

# Detection window: 10 minutes
findtime = 600

# Max failure attempts before ban
maxretry = 3

# Default action includes iptables ban + Telegram instant notification
banaction = iptables-multiport
action = %(banaction)s[name=%(__name__)s, port="%(port)s", protocol="%(protocol)s", chain="%(chain)s"]
         telegram[name=%(__name__)s, bantime="%(bantime)s", telegram_token="%(telegram_token)s", telegram_chat_id="%(telegram_chat_id)s"]

# Token and Chat ID placeholders (replaced during installation from .env)
telegram_token = YOUR_TELEGRAM_BOT_TOKEN
telegram_chat_id = YOUR_TELEGRAM_CHAT_ID

# ------------------------------------------------------------------------------
# 1. SSH Protection (Anti-Brute Force SSH)
# ------------------------------------------------------------------------------
[sshd]
enabled  = true
port     = ssh
logpath  = /var/log/auth.log
backend  = systemd
maxretry = 3
findtime = 600
bantime  = 86400

# ------------------------------------------------------------------------------
# 2. Nginx Scanner & Vulnerability Probes (/.env, /.git, /wp-login, phpmyadmin)
# ------------------------------------------------------------------------------
[nginx-botsearch]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/*access.log
filter   = nginx-botsearch
maxretry = 2
findtime = 300
bantime  = 86400

# ------------------------------------------------------------------------------
# 3. Nginx Bad Bots & Scanners
# ------------------------------------------------------------------------------
[nginx-badbots]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/*access.log
filter   = apache-badbots
maxretry = 2
findtime = 300
bantime  = 86400

# ------------------------------------------------------------------------------
# 4. Nginx Rate Limit (Excess Request Abuse)
# ------------------------------------------------------------------------------
[nginx-limit-req]
enabled  = true
port     = http,https
logpath  = /var/log/nginx/*error.log
filter   = nginx-limit-req
maxretry = 5
findtime = 60
bantime  = 3600
